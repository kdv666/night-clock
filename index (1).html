<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Night Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #clock {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #time {
    font-family: "SF Mono", "Menlo", "DejaVu Sans Mono", "Courier New", monospace;
    font-size: 13vw;      /* HH:MM:SS fills about 65% of screen width */
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    /* colour and glow are set by the script from the brightness value */
    text-shadow: 0 0 0.35em rgba(255, 0, 0, 0.3);
  }
  #date {
    margin-top: 1.5vw;
    font-family: "SF Mono", "Menlo", "DejaVu Sans Mono", "Courier New", monospace;
    font-size: 4.2vw;     /* noticeably larger than before */
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    cursor: pointer;     /* tapping it toggles fullscreen */
  }
  #hint {
    position: fixed;
    bottom: max(2vh, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: 1.8vw;
    color: #777;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
  <div id="clock">
    <div id="time">--:--:--</div>
    <div id="date"></div>
  </div>
  <div id="hint">Swipe up = brighter &nbsp;·&nbsp; Swipe down = dimmer &nbsp;·&nbsp; Double-tap = reset &nbsp;·&nbsp; Tap date = fullscreen</div>

<script>
(function () {
  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var hint = document.getElementById("hint");

  // Brightness: 1.0 = full, 0.10 = dimmest. Starts at the minimum.
  var B_MIN = 0.10;
  var B_MAX = 1.0;
  var b = B_MIN;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  function tick() {
    var d = new Date();
    var t = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    if (timeEl.textContent !== t) timeEl.textContent = t;
    var ds = DAYS[d.getDay()] + ", " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
    if (dateEl.textContent !== ds) dateEl.textContent = ds;
  }
  tick();
  setInterval(tick, 250);

  // Apply brightness by colouring the text itself (reliable in every browser)
  function apply() {
    if (b < B_MIN) b = B_MIN;
    if (b > B_MAX) b = B_MAX;
    timeEl.style.color = "rgba(255, 0, 0, " + b.toFixed(3) + ")";
    timeEl.style.textShadow = "0 0 0.35em rgba(255, 0, 0, " + (0.3 * b).toFixed(3) + ")";
    // date gets a boost so it stays readable even at minimum brightness
    var db = Math.min(1, b + 0.30);
    dateEl.style.color = "rgba(255, 48, 48, " + db.toFixed(3) + ")";
  }

  var hintTimer = null;
  function showHint() {
    hint.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.remove("show"); }, 4000);
  }

  // ---- Swipe to change brightness (pointer events: touch, pen and mouse) ----
  var startY = null;
  var startB = null;

  document.addEventListener("pointerdown", function (e) {
    startY = e.clientY;
    startB = b;
    showHint();
  }, { passive: true });

  document.addEventListener("pointermove", function (e) {
    if (startY === null) return;
    var h = window.innerHeight || 1;
    var dy = (e.clientY - startY) / h;   // negative when swiping up
    b = startB - dy;                      // full-height swipe = full brightness range
    apply();
  }, { passive: true });

  document.addEventListener("pointerup", function () { startY = null; }, { passive: true });
  document.addEventListener("pointercancel", function () { startY = null; }, { passive: true });

  // Prevent page rubber-banding and double-tap zoom on iPad
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // Double-tap resets brightness to the minimum
  var lastTap = 0;
  document.addEventListener("pointerup", function () {
    var now = Date.now();
    if (now - lastTap < 350) { b = B_MIN; apply(); showHint(); }
    lastTap = now;
  }, { passive: true });

  // Tapping the date toggles fullscreen (works in desktop browsers; iPad may vary)
  dateEl.addEventListener("click", function () {
    try {
      var d = document.documentElement;
      var req = d.requestFullscreen || d.webkitRequestFullscreen;
      if (!req) {
        showHint();
        hint.textContent = "Fullscreen not supported in this browser";
        return;
      }
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        req.call(d);
      }
    } catch (err) { /* ignore */ }
  });

  apply();
  showHint();
})();
</script>
</body>
</html>
